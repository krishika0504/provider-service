spring.application.name=${APP_NAME:provider-service}

# ===============================
# Server
# ===============================
server.port=${SERVER_PORT:8082}

# ===============================
# Supabase PostgreSQL (Session Pooler - Port 5432)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:false}
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.default_schema=${JPA_DEFAULT_SCHEMA:public}

# ===============================
# Swagger / OpenAPI
# ===============================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Eureka Client
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=${EUREKA_REGISTER:true}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:true}
eureka.instance.prefer-ip-address=${EUREKA_PREFER_IP:true}

# ===============================
# Internal Microservice Security
# ===============================

homeserve.internal.api-key=${INTERNAL_API_KEY}


logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=TRACE


server.error.include-message=always
server.error.include-binding-errors=always

# ===============================
# Redis - Live Tracking
# ===============================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

homeserve.tracking.location-ttl-seconds=${TRACKING_LOCATION_TTL_SECONDS:120}


firebase.project-id=${FIREBASE_PROJECT_ID}